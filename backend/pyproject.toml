[project]
name = "erp-prodesa-backend"
version = "0.1.0"
description = "ERP Prodesa - backend (monolito modular FastAPI). Módulo 1: ADPRO."
requires-python = ">=3.12"
# Las dependencias se instalan con requirements.txt / requirements-dev.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20"]
ignore = ["B008", "E501"]  # E501: lo maneja ruff format

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.coverage.run]
source = ["app"]
