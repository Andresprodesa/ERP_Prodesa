# ERP Prodesa - Integración continua.
# Lint + tests del backend (SQLite), migraciones + seed sobre PostgreSQL 16 real,
# build del frontend y build (sin push) de las imágenes Docker.
# Los secretos usados aquí son valores de PRUEBA efímeros del runner (no credenciales reales).
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check app tests --output-format=github
      - name: Ruff (formato)
        run: ruff format --check app tests
      - name: Pytest + cobertura
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Migraciones + seed sobre SQLite en archivo
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.seed   # idempotente
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: ignore

  backend-postgres:
    name: Backend sobre PostgreSQL 16 (migraciones + seed)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_prodesa
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-solo-pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp_prodesa"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://erp:ci-solo-pruebas@localhost:5432/erp_prodesa
      ENVIRONMENT: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migraciones (upgrade, downgrade, upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Esquema sin cambios pendientes (modelos == migraciones)
        run: alembic check
      - name: Seed de datos sintéticos (2 veces, idempotente)
        run: |
          python -m app.seed
          python -m app.seed

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (incluye tsc --noEmit)
        run: npm run build

  docker:
    name: Build de imágenes (sin publicar)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: erp-prodesa-backend:ci
      - name: Imagen frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: erp-prodesa-frontend:ci
